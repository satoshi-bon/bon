name: Fix v06 rainbow particle size
on:
  push:
    paths:
      - '.github/workflows/fix-v06-rainbow-size.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore kicker and triple rainbow PointsMaterial size
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('threejs/sky/v06/index.html')
          s=p.read_text()
          bad='.kicker{margin:0 0 16px;font-size:3.0*(clamp(10px),1vw,13px);'
          good='.kicker{margin:0 0 16px;font-size:clamp(10px,1vw,13px);'
          if bad not in s:
              raise SystemExit('bad kicker marker not found')
          s=s.replace(bad,good,1)
          old='const mat=new THREE.PointsMaterial({size:mobile?.09:.115,sizeAttenuation:true,vertexColors:true,transparent:true,opacity:0,depthWrite:false});'
          new='const mat=new THREE.PointsMaterial({size:mobile?.27:.345,sizeAttenuation:true,vertexColors:true,transparent:true,opacity:0,depthWrite:false});'
          if old not in s:
              raise SystemExit('rainbow PointsMaterial size marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit corrected v06 size
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Satoshi Yamada'
          git config user.email 'satoshi.bon@gmail.com'
          git add threejs/sky/v06/index.html
          git commit -m 'Fix v06 and triple only rainbow particle size'
          git push
