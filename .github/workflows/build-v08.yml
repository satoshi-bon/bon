name: Build Living Field v08
on:
  push:
    paths:
      - '.github/workflows/build-v08.yml'
permissions:
  contents: write
jobs:
  build-v08:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build v08 from v07
        run: python threejs/sky/build_v08.py
      - name: Validate JavaScript
        run: node --check /tmp/v08.mjs
      - name: Commit v08
        run: |
          git config user.name 'Satoshi Yamada'
          git config user.email 'satoshi.bon@gmail.com'
          git add threejs/sky/index.html threejs/sky/v08/index.html
          git commit -m 'Add Living Field v08 with small rainbow flyer flocks'
          git push
