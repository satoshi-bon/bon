name: Apply sky rainbow rebuild

on:
  push:
    paths:
      - '.github/workflows/apply-sky-rainbow-rebuild.yml'
      - 'threejs/sky/apply_rainbow_patch.py'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch exact v03 baseline
        run: python threejs/sky/apply_rainbow_patch.py
      - name: Commit rebuilt branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add threejs/sky/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild occasional rainbow morph from exact v03"
          git push
