name: Split sky versions
on:
  push:
    paths:
      - '.github/workflows/split-sky-versions.yml'
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create immutable v03 and v05
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p threejs/sky/v03 threejs/sky/v05

          # v03: exact historical source from the responsive-sky commit.
          git show d79f9dd22db7ee568e2cda2ef2831da77a900606:threejs/sky/index.html > threejs/sky/v03/index.html

          # v05: preserve the current rebuilt rainbow implementation, only rename its visible/version labels.
          cp threejs/sky/index.html threejs/sky/v05/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('threejs/sky/v05/index.html')
          s=p.read_text()
          s=s.replace('<!-- Living Field branch: v05 meadow + responsive sky + rebuilt rainbow morph / branch 04R -->','<!-- Living Field branch: v05 meadow + responsive sky + rainbow morph / v05 -->')
          s=s.replace('BRANCH · v03 base × rainbow morph','BRANCH · v05 · responsive sky × rainbow morph')
          s=s.replace('v03から再構築 ／ 一部の飛翔体のみ、共有風場の強い地点で虹色パーティクル集合へ変化','v03を基礎に発展 ／ 一部の飛翔体のみ、共有風場の強い地点で虹色パーティクル集合へ変化')
          s=s.replace('Three.js · GLSL · shared wind field · branch 04R','Three.js · GLSL · shared wind field · v05')
          p.write_text(s)
          PY

          # Stable router: old query-style URLs continue to work, but now point to immutable files.
          cat > threejs/sky/index.html <<'EOF'
          <!doctype html>
          <html lang="ja">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Living Field — version router</title>
          <script>
          (()=>{
            const raw=new URLSearchParams(location.search).get('v')||'05';
            const v=raw.replace(/^v/i,'').padStart(2,'0');
            const target=v==='03'?'v03/':'v05/';
            location.replace(new URL(target,location.href).href);
          })();
          </script>
          </head>
          <body>
          <p><a href="v05/">Living Field v05</a> / <a href="v03/">Living Field v03</a></p>
          </body>
          </html>
          EOF

          # Verify v03 is byte-identical to historical source.
          test "$(git hash-object threejs/sky/v03/index.html)" = "$(git rev-parse d79f9dd22db7ee568e2cda2ef2831da77a900606:threejs/sky/index.html)"

      - name: Commit split versions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Satoshi Yamada'
          git config user.email 'satoshi.bon@gmail.com'
          git add threejs/sky/index.html threejs/sky/v03/index.html threejs/sky/v05/index.html
          git commit -m 'Split sky demo into immutable v03 and v05'
          git push
