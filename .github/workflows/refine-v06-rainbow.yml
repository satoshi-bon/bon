name: Refine v06 rainbow morph
on:
  push:
    paths:
      - '.github/workflows/refine-v06-rainbow.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply refinement
        run: python threejs/sky/v06/refine_v06_rainbow.py
      - name: Validate JavaScript
        run: node --check /tmp/v06.mjs
      - name: Commit refined v06
        run: |
          git config user.name 'Satoshi Yamada'
          git config user.email 'satoshi.bon@gmail.com'
          git add threejs/sky/v06/index.html
          git commit -m 'Refine v06 rainbow morph into one compact vivid swarm'
          git push
