<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Architectural Informatics Lab. — WebGL2 Meadow</title>
<style>
  :root{
    --sky0:#c7e8f7;
    --sky1:#edf7fa;
    --sky2:#fbfdfb;
    --white:#fff;
    --muted:rgba(255,255,255,.80);
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dceef3}
  body{font-family:Inter,"Helvetica Neue",Arial,"Hiragino Sans","Yu Gothic",sans-serif}
  #hero{
    position:relative;width:100%;height:100svh;min-height:560px;max-height:920px;overflow:hidden;isolation:isolate;
    background:
      radial-gradient(circle at 76% 18%,rgba(255,255,255,.90),rgba(255,255,255,0) 30%),
      radial-gradient(circle at 15% 12%,rgba(255,255,255,.46),rgba(255,255,255,0) 27%),
      linear-gradient(to bottom,var(--sky0) 0%,var(--sky1) 45%,var(--sky2) 61%,#eef5df 62%,#aacb68 100%);
  }
  #hero:after{
    content:"";position:absolute;left:0;right:0;top:55%;height:16%;z-index:1;pointer-events:none;
    background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,.55) 42%,rgba(255,255,255,0));
    filter:blur(10px);
  }
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:2}
  .copy{position:absolute;left:clamp(24px,4.8vw,78px);top:clamp(28px,7vh,86px);z-index:4;color:#fff;pointer-events:none;max-width:min(650px,84vw)}
  .kicker{margin:0 0 16px;font-size:clamp(10px,1vw,13px);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  h1{margin:0 0 17px;font-size:clamp(34px,6.2vw,84px);line-height:.93;font-weight:620;letter-spacing:-.035em;text-shadow:0 8px 28px rgba(31,52,41,.10)}
  .sub{margin:0;font-size:clamp(12px,1.22vw,17px);line-height:1.7;letter-spacing:.02em;color:rgba(255,255,255,.84);text-shadow:0 4px 16px rgba(31,52,41,.08)}
  .tech{position:absolute;right:clamp(16px,2.6vw,32px);bottom:clamp(16px,2.4vw,26px);z-index:4;padding:8px 11px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(255,255,255,.08);backdrop-filter:blur(9px);font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.66);pointer-events:none}
  #fallback{display:none;position:absolute;inset:0;z-index:8;align-items:center;justify-content:center;padding:28px;text-align:center;color:#52645a;background:linear-gradient(#d3edf7,#f7fbf7 60%,#a9ca69)}
  @media(max-width:760px){#hero{min-height:620px}.copy{top:32px;max-width:88vw}.tech{display:none}}
  @media(prefers-reduced-motion:reduce){.tech{display:none}}
</style>
</head>
<body>
<main id="hero" aria-label="水平線まで広がる草原を、WebGL2とGLSLで手前から奥へ伝わるランダムな風として表現した動的グラフィック">
  <canvas id="gl"></canvas>
  <section class="copy">
    <p class="kicker">Architectural Informatics Lab.</p>
    <h1>Wide horizon.<br>Living field.</h1>
    <p class="sub">Yamada Satoshi Lab. / Ritsumeikan University</p>
  </section>
  <div class="tech">WebGL2 · GLSL · GPU instancing</div>
  <div id="fallback">このブラウザでは WebGL2 を利用できません。</div>
</main>
<script>
(() => {
'use strict';
const canvas=document.getElementById('gl');
const hero=document.getElementById('hero');
const fallback=document.getElementById('fallback');
const gl=canvas.getContext('webgl2',{alpha:true,antialias:true,premultipliedAlpha:false,powerPreference:'high-performance'});
if(!gl){fallback.style.display='flex';return;}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const mobile=matchMedia('(max-width: 760px)').matches;

function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}
function prog(vs,fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p}
function mul(a,b){const o=new Float32Array(16);for(let r=0;r<4;r++)for(let c=0;c<4;c++)o[c*4+r]=a[0*4+r]*b[c*4+0]+a[1*4+r]*b[c*4+1]+a[2*4+r]*b[c*4+2]+a[3*4+r]*b[c*4+3];return o}
function perspective(fovy,aspect,near,far){const f=1/Math.tan(fovy/2),nf=1/(near-far);return new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(far+near)*nf,-1,0,0,2*far*near*nf,0])}
function norm(v){const l=Math.hypot(...v)||1;return v.map(x=>x/l)}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function lookAt(eye,center,up){const z=norm([eye[0]-center[0],eye[1]-center[1],eye[2]-center[2]]),x=norm(cross(up,z)),y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-(x[0]*eye[0]+x[1]*eye[1]+x[2]*eye[2]),-(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]),-(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]),1])}
function rand(){return Math.random()}
function hash(n){const x=Math.sin(n*91.771)*43758.5453;return x-Math.floor(x)}

const MAX_GUSTS=6;
const grassVS=`#version 300 es
precision highp float;
layout(location=0) in vec4 iXZHW;
layout(location=1) in vec4 iSeedHueLean;
uniform mat4 uVP;
uniform float uTime;
uniform vec4 uGustA[${MAX_GUSTS}];
uniform vec4 uGustB[${MAX_GUSTS}];
out float vDepth;out float vProg;out float vWind;out float vHue;out float vTone;
float hash21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.0,a=.5;for(int k=0;k<4;k++){s+=a*n2(p);p=p*2.03+17.1;a*=.5;}return s;}
void main(){
 int seg=gl_VertexID/2; int sideI=gl_VertexID-2*seg; float prog=float(seg)/5.0; float side=float(sideI)*2.0-1.0;
 float x0=iXZHW.x,z0=iXZHW.y,h=iXZHW.z,w=iXZHW.w; float seed=iSeedHueLean.x; float yaw=iSeedHueLean.y*6.2831853; float lean=(iSeedHueLean.z-.5)*.23; float hue=iSeedHueLean.w;
 vec3 wp=vec3(x0,prog*h,z0);
 float taper=pow(1.0-prog,0.72); vec2 sideDir=normalize(vec2(cos(yaw)*.38+.72,sin(yaw)*.38)); wp.xz+=sideDir*side*w*taper;
 vec2 wind=vec2(0.0); float e=0.0;
 for(int i=0;i<${MAX_GUSTS};i++){vec4 a=uGustA[i],b=uGustB[i];vec2 d=vec2((x0-a.x)/a.z,(z0-a.y)/(a.z*1.65));float inf=exp(-dot(d,d)*1.55);float irr=.68+.20*sin(uTime*(.68+b.w)+b.z+x0*.21+z0*.13+seed*5.1)+.12*sin(uTime*(1.13+b.w*.6)+b.z*1.7+z0*.39);float s=inf*a.w*irr;wind+=normalize(vec2(b.x,-1.0))*s;e+=s;}
 float amb=(fbm(vec2(x0*.10+uTime*.025,z0*.095-uTime*.045)+seed*2.0)-.5); wind+=vec2(amb*.24,-.04-abs(amb)*.04);
 float bend=(.055+e*.34+abs(amb)*.06)*h*pow(prog,1.72); wp.xz+=wind*bend; wp.x+=lean*h*prog*prog;
 vDepth=clamp((-z0+3.0)/76.0,0.0,1.0);vProg=prog;vWind=clamp(e,0.0,1.6);vHue=hue;vTone=hash21(vec2(x0,z0));gl_Position=uVP*vec4(wp,1.0);
}`;
const grassFS=`#version 300 es
precision highp float;in float vDepth;in float vProg;in float vWind;in float vHue;in float vTone;out vec4 outColor;
void main(){vec3 nearC=vec3(.29,.56,.19);vec3 midC=vec3(.43,.68,.27);vec3 farC=vec3(.66,.78,.43);vec3 c=mix(nearC,midC,.45+vTone*.25);c=mix(c,farC,smoothstep(.38,1.0,vDepth));c+=vec3(.07,.085,.025)*vWind;c=mix(c,vec3(.78,.88,.83),smoothstep(.72,1.0,vDepth)*.72);c+=vec3(.035,.045,.012)*vProg;float a=mix(.94,.34,smoothstep(.56,1.0,vDepth));outColor=vec4(c,a);}`;
const groundVS=`#version 300 es
precision highp float;layout(location=0) in vec3 aPos;uniform mat4 uVP;out vec3 vW;void main(){vW=aPos;gl_Position=uVP*vec4(aPos,1.0);}`;
const groundFS=`#version 300 es
precision highp float;in vec3 vW;uniform float uTime;uniform vec4 uGustA[${MAX_GUSTS}];uniform vec4 uGustB[${MAX_GUSTS}];out vec4 outColor;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
void main(){float depth=clamp((-vW.z+3.0)/78.0,0.,1.);vec3 c=mix(vec3(.39,.63,.20),vec3(.68,.78,.42),depth);float gust=0.;for(int i=0;i<${MAX_GUSTS};i++){vec4 a=uGustA[i];vec2 d=vec2((vW.x-a.x)/a.z,(vW.z-a.y)/(a.z*1.7));float inf=exp(-dot(d,d)*1.25);float irr=.72+.18*sin(uTime*(.65+uGustB[i].w)+uGustB[i].z+vW.x*.18+vW.z*.10);gust+=inf*a.w*irr;}float tex=n(vW.xz*.17+vec2(uTime*.014,-uTime*.025));c+=vec3(.035,.055,.012)*(tex-.45);c+=vec3(.09,.105,.025)*min(gust,1.2);float fog=smoothstep(.55,1.,depth);c=mix(c,vec3(.84,.91,.86),fog*.76);outColor=vec4(c,1.);}`;
const pointVS=`#version 300 es
precision highp float;layout(location=0) in vec3 aPos;layout(location=1) in vec4 aColorSize;uniform mat4 uVP;out vec4 vColor;void main(){vec4 cp=uVP*vec4(aPos,1.);gl_Position=cp;float perspective=clamp(1.8/cp.w,.035,.22);gl_PointSize=clamp(aColorSize.w*perspective*92.,1.5,9.0);vColor=vec4(aColorSize.rgb,.24);}`;
const pointFS=`#version 300 es
precision highp float;in vec4 vColor;out vec4 outColor;void main(){vec2 p=gl_PointCoord-.5;float r=length(p);float a=atan(p.y,p.x);float edge=.20+.055*cos(4.*a);float mask=1.-smoothstep(edge-.035,edge+.025,r);float center=1.-smoothstep(.03,.13,r);float alpha=(mask*.62+center*.24)*vColor.a;if(alpha<.012)discard;outColor=vec4(vColor.rgb,alpha);}`;

const grassP=prog(grassVS,grassFS),groundP=prog(groundVS,groundFS),pointP=prog(pointVS,pointFS);
const grassVAO=gl.createVertexArray();gl.bindVertexArray(grassVAO);
const bladeCount=mobile?13000:28000;const inst=new Float32Array(bladeCount*8);
for(let i=0;i<bladeCount;i++){
 const r1=Math.random(),r2=Math.random();const depth=Math.pow(r1,.72);const z=5-depth*78;const spread=10+depth*34;const x=(r2-.5)*spread*2;const h=.16+Math.random()*.42+(1-depth)*.08;const w=.010+Math.random()*.015;const o=i*8;inst[o]=x;inst[o+1]=z;inst[o+2]=h;inst[o+3]=w;inst[o+4]=Math.random();inst[o+5]=Math.random();inst[o+6]=Math.random();inst[o+7]=Math.random();
}
const ib=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,ib);gl.bufferData(gl.ARRAY_BUFFER,inst,gl.STATIC_DRAW);
for(let j=0;j<2;j++){const loc=j;gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,4,gl.FLOAT,false,32,j*16);gl.vertexAttribDivisor(loc,1)}
gl.bindVertexArray(null);

const groundVAO=gl.createVertexArray();gl.bindVertexArray(groundVAO);const gp=new Float32Array([-44,0,8,44,0,8,-44,0,-82,-44,0,-82,44,0,8,44,0,-82]);const gb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,gb);gl.bufferData(gl.ARRAY_BUFFER,gp,gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,12,0);gl.bindVertexArray(null);

const agentCount=mobile?110:220;const agentPos=new Float32Array(agentCount*3),agentCol=new Float32Array(agentCount*4);const agents=[];const centers=[[-10,-15],[-4,-27],[5,-36],[11,-51]];const colors=[[.93,.38,.60],[.94,.80,.32],[.35,.70,.68],[.72,.54,.88],[.95,.63,.34]];
for(let i=0;i<agentCount;i++){const ci=i%centers.length,c=centers[ci],a=Math.random()*6.283,r=Math.pow(Math.random(),.7)*(1.5+Math.random()*3);const x=c[0]+Math.cos(a)*r,z=c[1]+Math.sin(a)*r*1.7,y=.18+Math.random()*.78;agents.push({x,y,z,vx:0,vy:0,vz:0,ci,seed:Math.random()*20,phase:Math.random()*6.28});const co=colors[i%colors.length],o=i*4;agentCol[o]=co[0];agentCol[o+1]=co[1];agentCol[o+2]=co[2];agentCol[o+3]=3.5+Math.random()*5.0;}
const pointVAO=gl.createVertexArray();gl.bindVertexArray(pointVAO);const pb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,pb);gl.bufferData(gl.ARRAY_BUFFER,agentPos.byteLength,gl.DYNAMIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,12,0);const pcb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,pcb);gl.bufferData(gl.ARRAY_BUFFER,agentCol,gl.STATIC_DRAW);gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,4,gl.FLOAT,false,16,0);gl.bindVertexArray(null);

const gusts=Array.from({length:MAX_GUSTS},()=>({x:0,z:0,width:0,strength:0,lateral:0,speed:0,phase:0,turb:0}));
function resetGust(g,initial=false){g.x=(Math.random()-.5)*24;g.z=initial?(7-Math.random()*82):(7+Math.random()*5);g.width=3.8+Math.random()*8.2;g.strength=.35+Math.random()*.85;g.lateral=(Math.random()-.5)*.55;g.speed=4.0+Math.random()*7.5;g.phase=Math.random()*6.283;g.turb=.18+Math.random()*.75}
gusts.forEach(g=>resetGust(g,true));const gustA=new Float32Array(MAX_GUSTS*4),gustB=new Float32Array(MAX_GUSTS*4);
function updateGusts(dt){gusts.forEach(g=>{g.z-=g.speed*dt;if(g.z<-78)resetGust(g,false)});for(let i=0;i<MAX_GUSTS;i++){const g=gusts[i],o=i*4;gustA[o]=g.x;gustA[o+1]=g.z;gustA[o+2]=g.width;gustA[o+3]=g.strength;gustB[o]=g.lateral;gustB[o+1]=g.speed;gustB[o+2]=g.phase;gustB[o+3]=g.turb;}}
function uniforms(p,vp,time){gl.uniformMatrix4fv(gl.getUniformLocation(p,'uVP'),false,vp);const t=gl.getUniformLocation(p,'uTime');if(t)gl.uniform1f(t,time);const a=gl.getUniformLocation(p,'uGustA[0]'),b=gl.getUniformLocation(p,'uGustB[0]');if(a)gl.uniform4fv(a,gustA);if(b)gl.uniform4fv(b,gustB)}

let W=1,H=1,vp,last=performance.now(),time=0,pointerX=0;
function resize(){const r=hero.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,mobile?1.35:1.75);W=Math.max(1,Math.round(r.width*dpr));H=Math.max(1,Math.round(r.height*dpr));if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H;canvas.style.width=r.width+'px';canvas.style.height=r.height+'px'}gl.viewport(0,0,W,H);const pr=perspective(42*Math.PI/180,r.width/r.height,.05,120);const vw=lookAt([0,2.65,6.5],[0,.45,-37],[0,1,0]);vp=mul(pr,vw)}
new ResizeObserver(resize).observe(hero);resize();hero.addEventListener('pointermove',e=>{const r=hero.getBoundingClientRect();pointerX=((e.clientX-r.left)/r.width-.5)*2});hero.addEventListener('pointerleave',()=>pointerX=0);

function updateAgents(t,dt){for(let i=0;i<agentCount;i++){const a=agents[i],base=centers[a.ci],cx=base[0]+Math.sin(t*.00023+a.phase)*1.8,cz=base[1]+Math.cos(t*.00017+a.phase*1.7)*2.6;let ax=(cx-a.x)*.08,az=(cz-a.z)*.05,ay=(.42+Math.sin(t*.00033+a.seed)*.22-a.y)*.06;ax+=Math.sin(t*.00071+a.seed+a.z*.09)*.12;az+=Math.cos(t*.00061+a.seed+a.x*.14)*.16;ax+=pointerX*.025;a.vx=(a.vx+ax*dt)*.95;a.vz=(a.vz+az*dt)*.95;a.vy=(a.vy+ay*dt)*.94;a.x+=a.vx;a.z+=a.vz;a.y+=a.vy;const o=i*3;agentPos[o]=a.x;agentPos[o+1]=a.y;agentPos[o+2]=a.z}gl.bindBuffer(gl.ARRAY_BUFFER,pb);gl.bufferSubData(gl.ARRAY_BUFFER,0,agentPos)}

function draw(now){const dt=Math.min(.04,(now-last)/1000);last=now;time=now/1000;updateGusts(dt);updateAgents(now,dt);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);
 gl.useProgram(groundP);uniforms(groundP,vp,time);gl.bindVertexArray(groundVAO);gl.disable(gl.BLEND);gl.depthMask(true);gl.drawArrays(gl.TRIANGLES,0,6);
 gl.useProgram(grassP);uniforms(grassP,vp,time);gl.bindVertexArray(grassVAO);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(true);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,12,bladeCount);
 gl.useProgram(pointP);gl.uniformMatrix4fv(gl.getUniformLocation(pointP,'uVP'),false,vp);gl.bindVertexArray(pointVAO);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);gl.drawArrays(gl.POINTS,0,agentCount);gl.depthMask(true);gl.bindVertexArray(null);
 if(!reduced)requestAnimationFrame(draw)}
if(reduced){updateGusts(0);updateAgents(0,0);draw(performance.now())}else requestAnimationFrame(draw);
})();
</script>
</body>
</html>
