<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Architectural Informatics Lab. — Living Field</title>
<style>
:root{--ink:rgba(255,255,255,.94);--muted:rgba(255,255,255,.78)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9eef5}
body{font-family:Inter,"Helvetica Neue",Arial,"Hiragino Sans","Yu Gothic",sans-serif}
#hero{position:relative;width:100%;height:100svh;min-height:560px;overflow:hidden;isolation:isolate;background:
radial-gradient(circle at 72% 12%,rgba(255,255,255,.96),rgba(255,255,255,0) 28%),
linear-gradient(to bottom,#badff1 0%,#dff1f7 37%,#f7fbf7 58%,#dfe8c3 67%,#87aa46 100%)}
#hero::after{content:"";position:absolute;left:-8%;right:-8%;top:52%;height:20%;z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,.58) 46%,rgba(255,255,255,0));filter:blur(14px)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:2}
.copy{position:absolute;left:clamp(26px,4.8vw,78px);top:clamp(30px,7vh,84px);z-index:4;color:var(--ink);pointer-events:none;max-width:min(660px,84vw)}
.kicker{margin:0 0 16px;font-size:clamp(10px,1vw,13px);font-weight:700;letter-spacing:.19em;text-transform:uppercase;color:var(--muted)}
h1{margin:0 0 18px;font-size:clamp(38px,6.5vw,88px);line-height:.92;font-weight:610;letter-spacing:-.04em;text-shadow:0 8px 32px rgba(33,55,43,.08)}
.sub{margin:0;font-size:clamp(12px,1.18vw,17px);line-height:1.7;letter-spacing:.02em;color:rgba(255,255,255,.82);text-shadow:0 4px 16px rgba(31,52,41,.07)}
.tech{position:absolute;right:clamp(16px,2.6vw,32px);bottom:clamp(16px,2.4vw,26px);z-index:4;padding:8px 11px;border:1px solid rgba(255,255,255,.24);border-radius:999px;background:rgba(255,255,255,.07);backdrop-filter:blur(9px);font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.68);pointer-events:none}
#error{display:none;position:absolute;inset:0;z-index:9;align-items:center;justify-content:center;padding:28px;text-align:center;color:#52645a;background:linear-gradient(#d3edf7,#f7fbf7 60%,#a9ca69)}
@media(max-width:760px){.copy{top:32px;max-width:88vw}.tech{display:none}}
</style>
</head>
<body>
<main id="hero" aria-label="手前から奥へ立体的な風の波が伝わる草原">
<canvas id="webgl"></canvas>
<section class="copy"><p class="kicker">Architectural Informatics Lab.</p><h1>Wide horizon.<br>Living field.</h1><p class="sub">Yamada Satoshi Lab. / Ritsumeikan University</p></section>
<div class="tech">Three.js · GLSL · instanced meadow</div>
<div id="error">WebGL の初期化に失敗しました。</div>
</main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.min.js';

const hero = document.getElementById('hero');
const canvas = document.getElementById('webgl');
const errorBox = document.getElementById('error');
const mobile = matchMedia('(max-width: 760px)').matches;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

let renderer;
try {
  renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true, powerPreference:'high-performance', premultipliedAlpha:false});
} catch (e) {
  errorBox.style.display = 'flex';
  throw e;
}
renderer.setClearColor(0x000000,0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, mobile ? 1.25 : 1.7));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(41, 1, 0.05, 130);
camera.position.set(0, 2.42, 7.0);
camera.lookAt(0, 0.38, -38);

const uniforms = {
  uTime:{value:0},
  uMotion:{value: reduced ? 0.28 : 1.0}
};

const groundVS = `
varying vec3 vW;
void main(){
  vec4 w=modelMatrix*vec4(position,1.0);
  vW=w.xyz;
  gl_Position=projectionMatrix*viewMatrix*w;
}`;

const groundFS = `
precision highp float;
varying vec3 vW;
uniform float uTime;
uniform float uMotion;
float hash21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash21(i),hash21(i+vec2(1.,0.)),f.x),mix(hash21(i+vec2(0.,1.)),hash21(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*noise2(p);p=p*2.03+17.1;a*=.5;}return s;}
float ridge(float x,float w){return exp(-x*x*w);}
void main(){
  float t=uTime*uMotion;
  float depth=clamp((-vW.z+1.0)/82.0,0.0,1.0);
  float broad=sin(vW.z*.105+t*.72 + sin(vW.x*.055+t*.17)*1.7);
  float mid=sin(vW.z*.205+t*1.18 + vW.x*.09 + sin(vW.z*.045-t*.21));
  float fine=fbm(vec2(vW.x*.11+t*.035,vW.z*.10+t*.17));
  float band1=ridge(broad-.18,4.2);
  float band2=ridge(mid+.30,7.0);
  float wind=clamp(.72*band1+.42*band2+.25*fine,0.0,1.35);
  vec3 nearC=vec3(.31,.54,.14);
  vec3 farC=vec3(.67,.75,.39);
  vec3 c=mix(nearC,farC,pow(depth,.68));
  c+=vec3(.10,.105,.025)*wind;
  c+=vec3(.035,.05,.008)*(fine-.45);
  float fog=smoothstep(.58,1.0,depth);
  c=mix(c,vec3(.84,.90,.84),fog*.72);
  gl_FragColor=vec4(c,1.0);
}`;

const groundGeo = new THREE.PlaneGeometry(96, 96, 1, 1);
groundGeo.rotateX(-Math.PI/2);
groundGeo.translate(0,0,-39);
const groundMat = new THREE.ShaderMaterial({uniforms,vertexShader:groundVS,fragmentShader:groundFS});
scene.add(new THREE.Mesh(groundGeo,groundMat));

const segments=6;
const basePos=[];
const baseIdx=[];
for(let s=0;s<=segments;s++){
  const y=s/segments;
  basePos.push(-.5,y,0,.5,y,0);
}
for(let s=0;s<segments;s++){
  const a=s*2,b=a+1,c=a+2,d=a+3;
  baseIdx.push(a,b,c,b,d,c);
}
const grassGeo=new THREE.InstancedBufferGeometry();
grassGeo.setAttribute('position',new THREE.Float32BufferAttribute(basePos,3));
grassGeo.setIndex(baseIdx);

const bladeCount=mobile?19000:36000;
const instA=new Float32Array(bladeCount*4);
const instB=new Float32Array(bladeCount*4);
for(let i=0;i<bladeCount;i++){
  const depth=Math.pow(Math.random(),.68);
  const z=5.8-depth*84;
  const spread=11+depth*40;
  const x=(Math.random()-.5)*spread*2;
  const h=.18+Math.random()*.48+(1-depth)*.09;
  const w=.008+Math.random()*.012;
  const o=i*4;
  instA[o]=x; instA[o+1]=z; instA[o+2]=h; instA[o+3]=w;
  instB[o]=Math.random(); instB[o+1]=Math.random(); instB[o+2]=Math.random(); instB[o+3]=Math.random();
}
grassGeo.setAttribute('iXZHW',new THREE.InstancedBufferAttribute(instA,4));
grassGeo.setAttribute('iSeed',new THREE.InstancedBufferAttribute(instB,4));
grassGeo.instanceCount=bladeCount;

const grassVS = `
precision highp float;
attribute vec4 iXZHW;
attribute vec4 iSeed;
uniform float uTime;
uniform float uMotion;
varying float vDepth;
varying float vTip;
varying float vWind;
varying float vTone;
float hash21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash21(i),hash21(i+vec2(1.,0.)),f.x),mix(hash21(i+vec2(0.,1.)),hash21(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*noise2(p);p=p*2.02+13.7;a*=.5;}return s;}
float ridge(float x,float w){return exp(-x*x*w);}
void main(){
  float prog=position.y;
  float side=position.x*2.0;
  float x0=iXZHW.x,z0=iXZHW.y,h=iXZHW.z,w=iXZHW.w;
  float seed=iSeed.x;
  float yaw=iSeed.y*6.2831853;
  float lean=(iSeed.z-.5)*.24;
  float tone=iSeed.w;
  float t=uTime*uMotion;

  float broad=sin(z0*.105+t*.72 + sin(x0*.055+t*.17)*1.7);
  float mid=sin(z0*.205+t*1.18 + x0*.09 + sin(z0*.045-t*.21));
  float narrow=sin(z0*.37+t*1.72 + x0*.18 + seed*4.0);
  float field=fbm(vec2(x0*.085+t*.028,z0*.09+t*.145));
  float band1=ridge(broad-.18,4.2);
  float band2=ridge(mid+.30,7.0);
  float band3=ridge(narrow-.42,10.0);
  float envelope=.64*band1+.38*band2+.18*band3;
  float micro=(fbm(vec2(x0*.21+seed*3.2+t*.06,z0*.19+t*.24))-.5);
  float wind=clamp(envelope*(.78+.45*field)+.16+.18*micro,0.0,1.45);

  vec2 windDir=normalize(vec2(.12 + .24*sin(t*.13+z0*.025),-1.0));
  float bendAmp=h*(.10+.62*wind)*pow(prog,1.58);
  vec3 wp=vec3(x0,prog*h,z0);
  wp.xz+=windDir*bendAmp;
  wp.x+=lean*h*prog*prog;
  wp.y-=h*(.03+.15*wind)*pow(prog,2.15);

  float taper=pow(1.0-prog,.76);
  vec2 sideDir=normalize(vec2(cos(yaw)*.45+.66,sin(yaw)*.45));
  wp.xz+=sideDir*side*w*taper;

  vDepth=clamp((-z0+1.0)/82.0,0.0,1.0);
  vTip=prog;
  vWind=wind;
  vTone=tone;
  gl_Position=projectionMatrix*viewMatrix*vec4(wp,1.0);
}`;

const grassFS = `
precision highp float;
varying float vDepth;
varying float vTip;
varying float vWind;
varying float vTone;
void main(){
  vec3 c0=vec3(.255,.50,.13);
  vec3 c1=vec3(.43,.65,.22);
  vec3 c2=vec3(.67,.76,.40);
  vec3 c=mix(c0,c1,.30+vTone*.38);
  c=mix(c,c2,smoothstep(.34,1.0,vDepth));
  c+=vec3(.115,.12,.028)*vWind;
  c+=vec3(.040,.050,.012)*vTip;
  c=mix(c,vec3(.82,.88,.82),smoothstep(.70,1.0,vDepth)*.68);
  float alpha=mix(.96,.30,smoothstep(.58,1.0,vDepth));
  gl_FragColor=vec4(c,alpha);
}`;

const grassMat=new THREE.ShaderMaterial({uniforms,vertexShader:grassVS,fragmentShader:grassFS,transparent:true,depthWrite:true,side:THREE.DoubleSide});
const grassMesh=new THREE.Mesh(grassGeo,grassMat);
grassMesh.frustumCulled=false;
scene.add(grassMesh);

const hazeGeo=new THREE.PlaneGeometry(110,22,1,1);
const hazeMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`precision highp float;varying vec2 vUv;void main(){float a=sin(vUv.y*3.1415926)*.17*(1.0-smoothstep(.82,1.0,vUv.x));gl_FragColor=vec4(.92,.96,.93,a);}`});
const haze=new THREE.Mesh(hazeGeo,hazeMat);
haze.position.set(0,4.6,-74);
scene.add(haze);

function resize(){
  const w=hero.clientWidth;
  const h=hero.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize,{passive:true});
resize();

const clock=new THREE.Clock();
let elapsed=0;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.05);
  elapsed+=dt;
  uniforms.uTime.value=elapsed;
  renderer.render(scene,camera);
});

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden) clock.getDelta();
});
</script>
</body>
</html>
