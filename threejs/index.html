<!doctype html>

<html lang="ja">
<head>

<style>
:root{--ink:rgba(255,255,255,.91);--muted:rgba(255,255,255,.70)}
*{box-sizing:border-box}

#hero{position:relative;width:100%;height:100svh;min-height:560px;overflow:hidden;isolation:isolate;background:linear-gradient(to bottom,#b9d8ea 0%,#d9e9f2 24%,#f0f3f2 51%,#f5f4ef 61%,#c9d98d 72%,#89ab49 100%)}
#hero::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 68% 16%,rgba(255,255,255,.70),rgba(255,255,255,0) 28%),linear-gradient(to bottom,rgba(255,255,255,.06),rgba(255,255,255,0) 26%,rgba(255,255,255,.08) 58%,rgba(255,255,255,.02))}
#hero::after{content:"";position:absolute;left:-8%;right:-8%;top:59%;height:15%;z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,.56) 48%,rgba(255,255,255,0));filter:blur(20px)}

.sub{margin:0;font-size:clamp(12px,1.18vw,17px);line-height:1.7;letter-spacing:.02em;color:rgba(255,255,255,.76);text-shadow:0 4px 12px rgba(31,52,41,.05)}
.tech{position:absolute;right:clamp(16px,2.6vw,32px);bottom:clamp(16px,2.4vw,26px);z-index:4;padding:8px 11px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(255,255,255,.05);backdrop-filter:blur(8px);font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.62);pointer-events:none}

</style>
</head>
<body>
<main id="hero" aria-label="手前から奥へ風が走り、左右斜めからの風が時々重なって干渉する草原">
  <canvas id="webgl"></canvas>
  <section class="copy">
    <p class="kicker">Architectural Informatics Lab.</p>
    <h1>Wide horizon.<br>Living field.</h1>
    <p class="sub">Yamada Satoshi Lab. / Ritsumeikan University</p>
  </section>
  <div class="version">Living Field v04 · 2026.08.26</div>
  <div class="change">手前 → 奥 ／ 左右斜め風 ／ 多方向干渉</div>
  <div class="tech">Three.js · GLSL · instanced meadow · v04</div>
  <div id="error">WebGL の初期化に失敗しました。</div>
</main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.min.js';

const hero=document.getElementById('hero');
const canvas=document.getElementById('webgl');
const errorBox=document.getElementById('error');
const mobile=matchMedia('(max-width:760px)').matches;
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
const MAX_PACKETS=5;
const MAX_WHIRLS=2;

let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:'high-performance',premultipliedAlpha:false});}
catch(e){errorBox.style.display='flex';throw e;}
renderer.setClearColor(0x000000,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.setPixelRatio(Math.min(devicePixelRatio||1,mobile?1.2:1.6));

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(36,1,.05,140);
camera.position.set(0,2.0,8.8);
camera.lookAt(0,.58,-45);

const dirA=new THREE.Vector2();
const dirB=new THREE.Vector2();
const dirC=new THREE.Vector2();
const directionStates=[
  {base:(Math.random()-.5)*.32,amp:.10+Math.random()*.13,f1:.035+Math.random()*.025,p:Math.random()*6.283},
  {base:.58+Math.random()*.34,amp:.10+Math.random()*.15,f1:.040+Math.random()*.028,p:Math.random()*6.283},
  {base:-.92-Math.random()*.34,amp:.10+Math.random()*.15,f1:.038+Math.random()*.028,p:Math.random()*6.283}
];
function setDir(v,a){const x=Math.sin(a),z=-Math.cos(a);v.set(x,z).normalize();}
function updateLayerDirections(t){const ds=[dirA,dirB,dirC];for(let i=0;i<3;i++){const s=directionStates[i];setDir(ds[i],s.base+s.amp*Math.sin(t*s.f1+s.p));}}
updateLayerDirections(0);

const packetA=Array.from({length:MAX_PACKETS},()=>new THREE.Vector4());
const packetB=Array.from({length:MAX_PACKETS},()=>new THREE.Vector4());
const packets=Array.from({length:MAX_PACKETS},()=>({}));
const whirlA=Array.from({length:MAX_WHIRLS},()=>new THREE.Vector4());
const whirlB=Array.from({length:MAX_WHIRLS},()=>new THREE.Vector4());
const whirls=Array.from({length:MAX_WHIRLS},()=>({}));

function resetPacket(p,initial=false){
  const family=Math.random();
  let angle=family<.50?(Math.random()-.5)*.42:(family<.75?.52+Math.random()*.58:-1.10+Math.random()*.58);
  setDir(p._dir||(p._dir=new THREE.Vector2()),angle);
  p.dirX=p._dir.x;p.dirZ=p._dir.y;
  p.x=family<.50?(Math.random()-.5)*20:(family<.75?-26+Math.random()*10:16+Math.random()*10);
  p.z=initial?(7-Math.random()*82):(7+Math.random()*7);
  p.radius=5.2+Math.random()*9.0;
  p.strength=.22+Math.random()*.78;
  p.speed=6.0+Math.random()*7.0;
  p.wander=(Math.random()-.5)*.62;
  p.phase=Math.random()*Math.PI*2;
}
function resetWhirl(w,initial=false){
  w.x=(Math.random()-.5)*25;
  w.z=initial?(5-Math.random()*72):(7+Math.random()*8);
  w.radius=2.2+Math.random()*4.2;
  w.strength=.20+Math.random()*.44;
  w.spin=Math.random()<.5?-1:1;
  w.driftX=(Math.random()-.5)*.55;
  w.speed=3.0+Math.random()*3.5;
  w.phase=Math.random()*Math.PI*2;
  w.life=-(initial?Math.random()*7:3+Math.random()*9);
  w.lifeMax=2.8+Math.random()*3.0;
}
packets.forEach(p=>resetPacket(p,true));
whirls.forEach(w=>resetWhirl(w,true));

const uniforms={
  uTime:{value:0},uMotion:{value:reduced?.22:1},
  uPacketA:{value:packetA},uPacketB:{value:packetB},uWhirlA:{value:whirlA},uWhirlB:{value:whirlB},
  uDirA:{value:dirA},uDirB:{value:dirB},uDirC:{value:dirC},
  uInterference:{value:0},uEventAge:{value:0}
};

let interferenceActive=false;
let nextInterference=6+Math.random()*8;
let interferenceStart=0;
let interferenceEnd=0;
function updateInterference(dt,t){
  if(!interferenceActive&&t>=nextInterference){interferenceActive=true;interferenceStart=t;interferenceEnd=t+4.2+Math.random()*2.6;}
  if(interferenceActive&&t>=interferenceEnd){interferenceActive=false;nextInterference=t+8+Math.random()*13;}
  const target=interferenceActive?1:0;
  uniforms.uInterference.value+=(target-uniforms.uInterference.value)*Math.min(1,dt*(interferenceActive?3.4:2.2));
  uniforms.uEventAge.value=interferenceActive?t-interferenceStart:0;
}
function updatePackets(dt,t){
  for(let i=0;i<MAX_PACKETS;i++){
    const p=packets[i];
    const curve=Math.sin(t*.55+p.phase)*p.wander;
    p.x+=(p.dirX*p.speed+curve)*dt;
    p.z+=p.dirZ*p.speed*dt;
    if(p.z<-98||Math.abs(p.x)>50)resetPacket(p,false);
    packetA[i].set(p.x,p.z,p.radius,p.strength);
    packetB[i].set(p.dirX,p.dirZ,p.speed,p.phase);
  }
}
function updateWhirls(dt,t){
  for(let i=0;i<MAX_WHIRLS;i++){
    const w=whirls[i];w.life+=dt;
    if(w.life<0){whirlA[i].set(w.x,w.z,w.radius,0);whirlB[i].set(w.spin,w.phase,w.driftX,w.speed);continue;}
    w.x+=(w.driftX+Math.sin(t*.70+w.phase)*.08)*w.speed*dt;
    w.z-=(1.04+.20*Math.sin(t*.62+w.phase))*w.speed*dt;
    const fadeIn=Math.min(1,w.life/.32),fadeOut=Math.min(1,Math.max(0,(w.lifeMax-w.life)/.62));
    const env=Math.min(fadeIn,fadeOut);
    if(w.life>w.lifeMax||w.z<-94||Math.abs(w.x)>38){resetWhirl(w,false);continue;}
    whirlA[i].set(w.x,w.z,w.radius,w.strength*env);
    whirlB[i].set(w.spin,w.phase,w.driftX,w.speed);
  }
}
updatePackets(0,0);updateWhirls(0,0);

const commonGLSL=`
float hash21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash21(i),hash21(i+vec2(1.,0.)),f.x),mix(hash21(i+vec2(0.,1.)),hash21(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*noise2(p);p=p*2.03+11.7;a*=.5;}return s;}
float ridge(float x,float w){return exp(-x*x*w);}
float movingFront(vec2 p,vec2 source,vec2 dir,float center,float width,float lateral){
  vec2 q=p-source;float along=dot(q,dir);vec2 n=vec2(-dir.y,dir.x);float side=dot(q,n);
  return exp(-pow((along-center)/width,2.)*2.2)*exp(-pow(side/lateral,2.)*.75)*smoothstep(-2.,4.,along);
}`;

const groundVS=`varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.0);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`;
const groundFS=`
precision highp float;
varying vec3 vW;
uniform float uTime;uniform float uMotion;uniform vec4 uPacketA[${MAX_PACKETS}];uniform vec4 uPacketB[${MAX_PACKETS}];uniform vec4 uWhirlA[${MAX_WHIRLS}];uniform vec4 uWhirlB[${MAX_WHIRLS}];uniform vec2 uDirA;uniform vec2 uDirB;uniform vec2 uDirC;uniform float uInterference;uniform float uEventAge;
${commonGLSL}
void main(){
  float t=uTime*uMotion;vec2 p=vW.xz;float depth=clamp((-vW.z+2.)/96.,0.,1.);
  vec2 nA=vec2(-uDirA.y,uDirA.x),nB=vec2(-uDirB.y,uDirB.x),nC=vec2(-uDirC.y,uDirC.x);
  float broad=sin(dot(p,uDirA)*.086-t*.58+sin(dot(p,nA)*.032+t*.08)*1.35);
  float cross=sin(dot(p,uDirB)*.145-t*.80+sin(dot(p,nB)*.030-t*.10)*.72);
  float oblique=sin(dot(p,uDirC)*.205-t*1.00+sin(dot(p,nC)*.030+t*.11)*.62);
  float band1=ridge(broad-.12,4.1),band2=ridge(cross+.18,6.8),band3=ridge(oblique-.28,8.0);
  float centerA=mod(t*8.0,108.0),centerB=mod(t*9.2+27.0,112.0),centerC=mod(t*8.7+59.0,112.0);
  float frontA=movingFront(p,vec2(0.,7.),uDirA,centerA,7.5,31.0);
  float frontB=movingFront(p,vec2(-26.,8.),uDirB,centerB,6.2,25.0);
  float frontC=movingFront(p,vec2(26.,8.),uDirC,centerC,6.2,25.0);
  float eventCenter=uEventAge*12.5;
  float eventA=movingFront(p,vec2(0.,7.),uDirA,eventCenter,6.0,34.0);
  float eventB=movingFront(p,vec2(-27.,8.),uDirB,eventCenter,5.3,26.0);
  float eventC=movingFront(p,vec2(27.,8.),uDirC,eventCenter,5.3,26.0);
  float eventMix=uInterference*(eventA+eventB+eventC);
  float crossing=uInterference*(eventA*eventB+eventB*eventC+eventC*eventA)*2.2;
  float fine=fbm(vec2(vW.x*.065+t*.018,vW.z*.058-t*.09));
  float packet=0.;for(int i=0;i<${MAX_PACKETS};i++){vec4 a=uPacketA[i];vec4 b=uPacketB[i];vec2 d=vec2((vW.x-a.x)/(a.z*.95),(vW.z-a.y)/(a.z*2.15));float core=exp(-dot(d,d)*1.55);float skirt=exp(-dot(d*vec2(1.42,.78),d*vec2(1.42,.78))*.52);float burst=.09+1.60*pow(max(0.,sin(t*(1.02+b.z*.06)+b.w+float(i)*1.41)),4.0);packet+=(core+skirt*.38)*a.w*burst;}
  float whirl=0.;for(int i=0;i<${MAX_WHIRLS};i++){vec4 a=uWhirlA[i];vec2 d=p-a.xy;float dist=length(d);float core=exp(-pow(dist/max(a.z,.001),2.)*2.1);float ring=exp(-pow((dist-a.z*.55)/max(a.z*.38,.001),2.)*2.);float pulse=.12+1.08*pow(max(0.,sin(t*1.9+uWhirlB[i].y+float(i)*2.1)),3.3);whirl+=(core*.55+ring*.65)*a.w*pulse;}
  float base=.39*band1+.20*band2+.16*band3+.34*frontA+.27*frontB+.27*frontC+.24*eventMix+.54*crossing+.10*fine+.62*packet+.38*whirl;
  float wind=clamp(base,0.,2.15);
  vec3 nearC=vec3(.40,.58,.20),midC=vec3(.57,.71,.30),farC=vec3(.72,.80,.48);vec3 c=mix(nearC,midC,smoothstep(0.,.38,depth));c=mix(c,farC,smoothstep(.38,1.,depth));c+=vec3(.06,.07,.015)*wind;c+=vec3(.025,.028,.009)*crossing;c+=vec3(.02,.03,.006)*(fine-.45);float haze=smoothstep(.48,1.,depth);c=mix(c,vec3(.88,.91,.82),haze*.56);gl_FragColor=vec4(c,1.);
}`;
const groundGeo=new THREE.PlaneGeometry(112,110,1,1);groundGeo.rotateX(-Math.PI/2);groundGeo.translate(0,0,-48);scene.add(new THREE.Mesh(groundGeo,new THREE.ShaderMaterial({uniforms,vertexShader:groundVS,fragmentShader:groundFS})));

const segments=6,basePos=[],baseIdx=[];for(let s=0;s<=segments;s++){const y=s/segments;basePos.push(-.5,y,0,.5,y,0);}for(let s=0;s<segments;s++){const a=s*2,b=a+1,c=a+2,d=a+3;baseIdx.push(a,b,c,b,d,c);}const grassGeo=new THREE.InstancedBufferGeometry();grassGeo.setAttribute('position',new THREE.Float32BufferAttribute(basePos,3));grassGeo.setIndex(baseIdx);
const bladeCount=mobile?17000:30000;const instA=new Float32Array(bladeCount*4),instB=new Float32Array(bladeCount*4);for(let i=0;i<bladeCount;i++){const depth=Math.pow(Math.random(),.72);const z=5-depth*96;const spread=14+depth*44;const x=(Math.random()-.5)*spread*2;const h=.14+Math.random()*.28+(1-depth)*.04;const w=.006+Math.random()*.010;const o=i*4;instA[o]=x;instA[o+1]=z;instA[o+2]=h;instA[o+3]=w;instB[o]=Math.random();instB[o+1]=Math.random();instB[o+2]=Math.random();instB[o+3]=Math.random();}grassGeo.setAttribute('iXZHW',new THREE.InstancedBufferAttribute(instA,4));grassGeo.setAttribute('iSeed',new THREE.InstancedBufferAttribute(instB,4));grassGeo.instanceCount=bladeCount;

const grassVS=`
precision highp float;
attribute vec4 iXZHW;attribute vec4 iSeed;uniform float uTime;uniform float uMotion;uniform vec4 uPacketA[${MAX_PACKETS}];uniform vec4 uPacketB[${MAX_PACKETS}];uniform vec4 uWhirlA[${MAX_WHIRLS}];uniform vec4 uWhirlB[${MAX_WHIRLS}];uniform vec2 uDirA;uniform vec2 uDirB;uniform vec2 uDirC;uniform float uInterference;uniform float uEventAge;varying float vDepth;varying float vTip;varying float vWind;varying float vTone;varying float vBlur;
${commonGLSL}
void main(){
  float prog=position.y,side=position.x*2.;float x0=iXZHW.x,z0=iXZHW.y,h=iXZHW.z,w=iXZHW.w;float seed=iSeed.x,yaw=iSeed.y*6.2831853,lean=(iSeed.z-.5)*.12,tone=iSeed.w;float t=uTime*uMotion;vec2 p0=vec2(x0,z0);vec2 nA=vec2(-uDirA.y,uDirA.x),nB=vec2(-uDirB.y,uDirB.x),nC=vec2(-uDirC.y,uDirC.x);
  float broad=sin(dot(p0,uDirA)*.086-t*.58+sin(dot(p0,nA)*.032+t*.08)*1.35+seed*.30);float cross=sin(dot(p0,uDirB)*.145-t*.80+sin(dot(p0,nB)*.030-t*.10)*.72+seed*.52);float oblique=sin(dot(p0,uDirC)*.205-t*1.00+sin(dot(p0,nC)*.030+t*.11)*.62+seed*.94);float band1=ridge(broad-.12,4.1),band2=ridge(cross+.18,6.8),band3=ridge(oblique-.28,8.0);
  float centerA=mod(t*8.0,108.0),centerB=mod(t*9.2+27.0,112.0),centerC=mod(t*8.7+59.0,112.0);float frontA=movingFront(p0,vec2(0.,7.),uDirA,centerA,7.5,31.0);float frontB=movingFront(p0,vec2(-26.,8.),uDirB,centerB,6.2,25.0);float frontC=movingFront(p0,vec2(26.,8.),uDirC,centerC,6.2,25.0);
  float eventCenter=uEventAge*12.5;float eventA=movingFront(p0,vec2(0.,7.),uDirA,eventCenter,6.0,34.0);float eventB=movingFront(p0,vec2(-27.,8.),uDirB,eventCenter,5.3,26.0);float eventC=movingFront(p0,vec2(27.,8.),uDirC,eventCenter,5.3,26.0);float eventMix=uInterference*(eventA+eventB+eventC);float crossing=uInterference*(eventA*eventB+eventB*eventC+eventC*eventA)*2.2;
  float packetWind=0.;vec2 packetDir=vec2(0.);for(int i=0;i<${MAX_PACKETS};i++){vec4 a=uPacketA[i];vec4 b=uPacketB[i];vec2 d=vec2((x0-a.x)/(a.z*.95),(z0-a.y)/(a.z*2.15));float core=exp(-dot(d,d)*1.55);float shell=exp(-dot(d*vec2(1.42,.78),d*vec2(1.42,.78))*.52);float burst=.09+1.60*pow(max(0.,sin(t*(1.02+b.z*.06)+b.w+float(i)*1.41)),4.0);float gust=(core+shell*.38)*a.w*burst;packetWind+=gust;packetDir+=normalize(b.xy)*gust;}
  float whirlWind=0.;vec2 whirlDir=vec2(0.);for(int i=0;i<${MAX_WHIRLS};i++){vec4 a=uWhirlA[i],b=uWhirlB[i];vec2 delta=p0-a.xy;float dist=max(length(delta),.0001);vec2 radial=delta/dist;vec2 tangent=vec2(-radial.y,radial.x)*b.x;float core=exp(-pow(dist/max(a.z,.001),2.)*2.1);float ring=exp(-pow((dist-a.z*.55)/max(a.z*.38,.001),2.)*2.);float pulse=.12+1.08*pow(max(0.,sin(t*1.9+b.y+float(i)*2.1)),3.3);float g=(core*.70+ring*.90)*a.w*pulse;whirlWind+=g;whirlDir+=(tangent+radial*.12)*g;}
  float fine=fbm(vec2(x0*.18+seed*2.8+t*.05,z0*.15-t*.18))-.5;float wind=clamp(.38*band1+.20*band2+.16*band3+.36*frontA+.28*frontB+.28*frontC+.25*eventMix+.58*crossing+.08+.10*fine+.64*packetWind+.40*whirlWind,0.,2.18);
  vec2 layerDir=uDirA*(.46*band1+.48*frontA)+uDirB*(.37*band2+.42*frontB)+uDirC*(.34*band3+.42*frontC);vec2 eventDir=(uDirA*eventA+uDirB*eventB+uDirC*eventC)*uInterference;vec2 collisionDir=normalize((uDirB-uDirC)+vec2(.001))*crossing*.58;vec2 dirMix=uDirA*.20+layerDir+eventDir*.48+collisionDir+packetDir*.48+whirlDir*.42+vec2(fine*.06,0.);vec2 windDir=dirMix/max(length(dirMix),1e-4);
  float bendAmp=h*(.045+.36*wind)*pow(prog,1.55);vec3 wp=vec3(x0,prog*h,z0);wp.xz+=windDir*bendAmp;wp.x+=lean*h*prog*prog;wp.y-=h*(.016+.095*wind)*pow(prog,2.0);float taper=pow(1.-prog,.82);vec2 sideDir=normalize(vec2(cos(yaw)*.20+.82,sin(yaw)*.20));wp.xz+=sideDir*side*w*taper;vDepth=clamp((-z0+2.)/96.,0.,1.);vTip=prog;vWind=wind;vTone=tone;vBlur=smoothstep(0.,.22,vDepth)*(1.-smoothstep(.28,.72,vDepth));gl_Position=projectionMatrix*viewMatrix*vec4(wp,1.0);
}`;

const hazeGeo=new THREE.PlaneGeometry(120,26,1,1);const hazeMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`precision highp float;varying vec2 vUv;void main(){float a=pow(sin(vUv.y*3.1415926),1.35)*.16;a*=1.0-smoothstep(.74,1.0,vUv.x);gl_FragColor=vec4(.93,.95,.90,a);}`});const haze=new THREE.Mesh(hazeGeo,hazeMat);haze.position.set(0,4.7,-76);scene.add(haze);
const foregroundGeo=new THREE.PlaneGeometry(120,24,1,1);const foregroundMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`precision highp float;varying vec2 vUv;void main(){float a=pow(1.0-vUv.y,1.7)*.22;a*=smoothstep(.05,.35,vUv.x)*(1.0-smoothstep(.65,.95,vUv.x));gl_FragColor=vec4(.75,.82,.63,a);}`});const foreground=new THREE.Mesh(foregroundGeo,foregroundMat);foreground.position.set(0,.65,-4);foreground.rotation.x=-Math.PI*.5;scene.add(foreground);
