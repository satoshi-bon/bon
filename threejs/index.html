<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Architectural Informatics Lab. — Living Field</title>
<style>
:root{--ink:rgba(255,255,255,.91);--muted:rgba(255,255,255,.70)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d7e8f1}
body{font-family:Inter,"Helvetica Neue",Arial,"Hiragino Sans","Yu Gothic",sans-serif}
#hero{position:relative;width:100%;height:100svh;min-height:560px;overflow:hidden;isolation:isolate;background:
linear-gradient(to bottom,#b9d8ea 0%,#d9e9f2 24%,#f0f3f2 51%,#f5f4ef 61%,#c9d98d 72%,#89ab49 100%)}
#hero::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:
radial-gradient(circle at 68% 16%,rgba(255,255,255,.70),rgba(255,255,255,0) 28%),
linear-gradient(to bottom,rgba(255,255,255,.06),rgba(255,255,255,0) 26%,rgba(255,255,255,.08) 58%,rgba(255,255,255,.02));}
#hero::after{content:"";position:absolute;left:-8%;right:-8%;top:59%;height:15%;z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,.56) 48%,rgba(255,255,255,0));filter:blur(20px)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:2}
.copy{position:absolute;left:clamp(28px,4.8vw,78px);top:clamp(36px,7vh,84px);z-index:4;color:var(--ink);pointer-events:none;max-width:min(660px,84vw)}
.kicker{margin:0 0 16px;font-size:clamp(10px,1vw,13px);font-weight:700;letter-spacing:.19em;text-transform:uppercase;color:var(--muted)}
h1{margin:0 0 18px;font-size:clamp(38px,6.5vw,88px);line-height:.92;font-weight:610;letter-spacing:-.04em;text-shadow:0 8px 28px rgba(33,55,43,.06)}
.sub{margin:0;font-size:clamp(12px,1.18vw,17px);line-height:1.7;letter-spacing:.02em;color:rgba(255,255,255,.76);text-shadow:0 4px 12px rgba(31,52,41,.05)}
.tech{position:absolute;right:clamp(16px,2.6vw,32px);bottom:clamp(16px,2.4vw,26px);z-index:4;padding:8px 11px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(255,255,255,.05);backdrop-filter:blur(8px);font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.62);pointer-events:none}
#error{display:none;position:absolute;inset:0;z-index:9;align-items:center;justify-content:center;padding:28px;text-align:center;color:#52645a;background:linear-gradient(#d3edf7,#f7fbf7 60%,#a9ca69)}
@media(max-width:760px){.copy{top:32px;max-width:88vw}.tech{display:none}}
</style>
</head>
<body>
<main id="hero" aria-label="広い地平線と風の層に加えて、たまに突風とつむじ風が走る草原">
  <canvas id="webgl"></canvas>
  <section class="copy">
    <p class="kicker">Architectural Informatics Lab.</p>
    <h1>Wide horizon.<br>Living field.</h1>
    <p class="sub">Yamada Satoshi Lab. / Ritsumeikan University</p>
  </section>
  <div class="tech">Three.js · GLSL · instanced meadow</div>
  <div id="error">WebGL の初期化に失敗しました。</div>
</main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.min.js';

const hero = document.getElementById('hero');
const canvas = document.getElementById('webgl');
const errorBox = document.getElementById('error');
const mobile = matchMedia('(max-width: 760px)').matches;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MAX_PACKETS = 5;
const MAX_WHIRLS = 2;

let renderer;
try {
  renderer = new THREE.WebGLRenderer({
    canvas,
    alpha:true,
    antialias:true,
    powerPreference:'high-performance',
    premultipliedAlpha:false
  });
} catch (e) {
  errorBox.style.display = 'flex';
  throw e;
}
renderer.setClearColor(0x000000,0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, mobile ? 1.2 : 1.6));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 0.05, 140);
camera.position.set(0, 2.0, 8.8);
camera.lookAt(0, 0.58, -45);

const packetA = Array.from({length:MAX_PACKETS}, () => new THREE.Vector4());
const packetB = Array.from({length:MAX_PACKETS}, () => new THREE.Vector4());
const packets = Array.from({length:MAX_PACKETS}, () => ({}));
const whirlA = Array.from({length:MAX_WHIRLS}, () => new THREE.Vector4());
const whirlB = Array.from({length:MAX_WHIRLS}, () => new THREE.Vector4());
const whirls = Array.from({length:MAX_WHIRLS}, () => ({}));

function resetPacket(p, initial=false){
  p.x = (Math.random() - 0.5) * 36.0;
  p.z = initial ? (8 - Math.random() * 96) : (10 + Math.random() * 18);
  p.radius = 6.8 + Math.random() * 9.2;
  p.strength = 0.26 + Math.random() * 0.64;
  const angle = -Math.PI * 0.5 + (Math.random() - 0.5) * 0.78;
  p.dirX = Math.sin(angle) * (0.14 + Math.random() * 0.58);
  p.dirZ = -Math.cos(angle);
  p.speed = 2.1 + Math.random() * 4.7;
  p.wobble = 0.18 + Math.random() * 0.72;
  p.wander = (Math.random() - 0.5) * 0.55;
  p.phase = Math.random() * Math.PI * 2.0;
}

function resetWhirl(w, initial=false){
  w.x = (Math.random() - 0.5) * 28.0;
  w.z = initial ? (4 - Math.random() * 84.0) : (10 + Math.random() * 24.0);
  w.radius = 2.8 + Math.random() * 4.6;
  w.strength = 0.22 + Math.random() * 0.42;
  w.spin = Math.random() < 0.5 ? -1.0 : 1.0;
  w.driftX = (Math.random() - 0.5) * 0.38;
  w.speed = 0.8 + Math.random() * 1.5;
  w.phase = Math.random() * Math.PI * 2.0;
  w.life = 0.0;
  w.lifeMax = 5.5 + Math.random() * 5.0;
}

packets.forEach(p => resetPacket(p, true));
whirls.forEach(w => resetWhirl(w, true));

const uniforms = {
  uTime:{value:0},
  uMotion:{value: reduced ? 0.22 : 1.0},
  uPacketA:{value: packetA},
  uPacketB:{value: packetB},
  uWhirlA:{value: whirlA},
  uWhirlB:{value: whirlB}
};

function updatePackets(dt, t){
  for(let i=0;i<MAX_PACKETS;i++){
    const p = packets[i];
    const wobble = Math.sin(t * (0.26 + p.wobble * 0.12) + p.phase);
    const sway = Math.sin(t * (0.18 + p.wobble * 0.08) + p.phase * 1.5);
    p.x += (p.dirX * p.speed + wobble * p.wander) * dt;
    p.z += p.dirZ * p.speed * dt;
    if(p.z < -96 || Math.abs(p.x) > 46) resetPacket(p, false);
    packetA[i].set(p.x, p.z, p.radius, p.strength);
    packetB[i].set(p.dirX + sway * 0.14, p.dirZ, p.speed, p.phase);
  }
}

function updateWhirls(dt, t){
  for(let i=0;i<MAX_WHIRLS;i++){
    const w = whirls[i];
    w.life += dt;
    w.x += (w.driftX + Math.sin(t * 0.28 + w.phase) * 0.05) * w.speed * dt;
    w.z -= (0.62 + 0.18 * Math.sin(t * 0.23 + w.phase)) * w.speed * dt;
    const fadeIn = Math.min(1.0, w.life / 0.9);
    const fadeOut = Math.min(1.0, Math.max(0.0, (w.lifeMax - w.life) / 1.4));
    const envelope = Math.min(fadeIn, fadeOut);
    if(w.life > w.lifeMax || w.z < -92 || Math.abs(w.x) > 34) resetWhirl(w, false);
    whirlA[i].set(w.x, w.z, w.radius, w.strength * envelope);
    whirlB[i].set(w.spin, w.phase, w.driftX, w.speed);
  }
}

updatePackets(0,0);
updateWhirls(0,0);

const groundVS = `
varying vec3 vW;
void main(){
  vec4 w = modelMatrix * vec4(position,1.0);
  vW = w.xyz;
  gl_Position = projectionMatrix * viewMatrix * w;
}`;

const groundFS = `
precision highp float;
varying vec3 vW;
uniform float uTime;
uniform float uMotion;
uniform vec4 uPacketA[${MAX_PACKETS}];
uniform vec4 uPacketB[${MAX_PACKETS}];
uniform vec4 uWhirlA[${MAX_WHIRLS}];
uniform vec4 uWhirlB[${MAX_WHIRLS}];
float hash21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);} 
float noise2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash21(i),hash21(i+vec2(1.,0.)),f.x),mix(hash21(i+vec2(0.,1.)),hash21(i+vec2(1.,1.)),f.x),f.y);} 
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*noise2(p);p=p*2.03+11.7;a*=.5;}return s;} 
float ridge(float x,float w){return exp(-x*x*w);} 
void main(){
  float t=uTime*uMotion;
  float depth=clamp((-vW.z+2.0)/96.0,0.0,1.0);
  float broad=sin(vW.z*.086+t*.58 + sin(vW.x*.032+t*.10)*1.55);
  float cross=sin((vW.z*.152+vW.x*.078)+t*.81);
  float fine=fbm(vec2(vW.x*.065+t*.018,vW.z*.058+t*.09));
  float band1=ridge(broad-.12,4.2);
  float band2=ridge(cross+.18,7.2);
  float packet=0.0;
  for(int i=0;i<${MAX_PACKETS};i++){
    vec4 a=uPacketA[i];
    vec4 b=uPacketB[i];
    vec2 d=vec2((vW.x-a.x)/(a.z*.95),(vW.z-a.y)/(a.z*2.25));
    float core=exp(-dot(d,d)*1.55);
    float skirt=exp(-dot(d*vec2(1.45,.75),d*vec2(1.45,.75))*0.52);
    float burst=.18 + 1.22*pow(max(0.0,sin(t*(.56+b.z*.06)+b.w+float(i)*1.41)),3.2);
    packet += (core*1.05 + skirt*0.40) * a.w * burst;
  }
  float whirl=0.0;
  for(int i=0;i<${MAX_WHIRLS};i++){
    vec4 a=uWhirlA[i];
    vec2 d=vec2(vW.x-a.x,vW.z-a.y);
    float dist=length(d);
    float core=exp(-pow(dist/max(a.z,0.001),2.0)*2.1);
    float ring=exp(-pow((dist-a.z*0.55)/max(a.z*0.38,0.001),2.0)*2.0);
    float pulse=.20 + 0.95*pow(max(0.0,sin(t*.92 + uWhirlB[i].y + float(i)*2.1)),2.8);
    whirl += (core*0.55 + ring*0.65) * a.w * pulse;
  }
  float wind=clamp(.56*band1+.20*band2+.12*fine+packet*.60+whirl*.34,0.0,1.75);
  vec3 nearC=vec3(.40,.58,.20);
  vec3 midC=vec3(.57,.71,.30);
  vec3 farC=vec3(.72,.80,.48);
  vec3 c=mix(nearC,midC,smoothstep(.0,.38,depth));
  c=mix(c,farC,smoothstep(.38,1.0,depth));
  c+=vec3(.06,.07,.015)*wind;
  c+=vec3(.02,.03,.006)*(fine-.45);
  c+=vec3(.026,.026,.012)*whirl;
  float haze=smoothstep(.48,1.0,depth);
  c=mix(c,vec3(.88,.91,.82),haze*.56);
  gl_FragColor=vec4(c,1.0);
}`;

const groundGeo = new THREE.PlaneGeometry(112, 110, 1, 1);
groundGeo.rotateX(-Math.PI/2);
groundGeo.translate(0,0,-48);
const groundMat = new THREE.ShaderMaterial({uniforms,vertexShader:groundVS,fragmentShader:groundFS});
scene.add(new THREE.Mesh(groundGeo,groundMat));

const segments = 6;
const basePos = [];
const baseIdx = [];
for(let s=0;s<=segments;s++){
  const y=s/segments;
  basePos.push(-.5,y,0,.5,y,0);
}
for(let s=0;s<segments;s++){
  const a=s*2,b=a+1,c=a+2,d=a+3;
  baseIdx.push(a,b,c,b,d,c);
}
const grassGeo = new THREE.InstancedBufferGeometry();
grassGeo.setAttribute('position', new THREE.Float32BufferAttribute(basePos,3));
grassGeo.setIndex(baseIdx);

const bladeCount = mobile ? 17000 : 30000;
const instA = new Float32Array(bladeCount*4);
const instB = new Float32Array(bladeCount*4);
for(let i=0;i<bladeCount;i++){
  const depth=Math.pow(Math.random(),.72);
  const z=5.0-depth*96.0;
  const spread=14.0+depth*44.0;
  const x=(Math.random()-.5)*spread*2.0;
  const h=.14+Math.random()*.28+(1.0-depth)*.04;
  const w=.006+Math.random()*.010;
  const o=i*4;
  instA[o]=x; instA[o+1]=z; instA[o+2]=h; instA[o+3]=w;
  instB[o]=Math.random(); instB[o+1]=Math.random(); instB[o+2]=Math.random(); instB[o+3]=Math.random();
}
grassGeo.setAttribute('iXZHW', new THREE.InstancedBufferAttribute(instA,4));
grassGeo.setAttribute('iSeed', new THREE.InstancedBufferAttribute(instB,4));
grassGeo.instanceCount = bladeCount;

const grassVS = `
precision highp float;
attribute vec4 iXZHW;
attribute vec4 iSeed;
uniform float uTime;
uniform float uMotion;
uniform vec4 uPacketA[${MAX_PACKETS}];
uniform vec4 uPacketB[${MAX_PACKETS}];
uniform vec4 uWhirlA[${MAX_WHIRLS}];
uniform vec4 uWhirlB[${MAX_WHIRLS}];
varying float vDepth;
varying float vTip;
varying float vWind;
varying float vTone;
varying float vBlur;
float hash21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);} 
float noise2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash21(i),hash21(i+vec2(1.,0.)),f.x),mix(hash21(i+vec2(0.,1.)),hash21(i+vec2(1.,1.)),f.x),f.y);} 
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*noise2(p);p=p*2.02+13.7;a*=.5;}return s;} 
float ridge(float x,float w){return exp(-x*x*w);} 
void main(){
  float prog=position.y;
  float side=position.x*2.0;
  float x0=iXZHW.x,z0=iXZHW.y,h=iXZHW.z,w=iXZHW.w;
  float seed=iSeed.x;
  float yaw=iSeed.y*6.2831853;
  float lean=(iSeed.z-.5)*.12;
  float tone=iSeed.w;
  float t=uTime*uMotion;

  float broad=sin(z0*.086+t*.58 + sin(x0*.032+t*.10)*1.55);
  float cross=sin((z0*.152+x0*.078)+t*.81 + seed*1.2);
  float ripple=sin(z0*.26+t*1.18 + x0*.07 + seed*3.7);
  float field=fbm(vec2(x0*.065+t*.018,z0*.058+t*.09));
  float band1=ridge(broad-.12,4.2);
  float band2=ridge(cross+.18,7.2);
  float band3=ridge(ripple-.34,10.0);

  float packetWind=0.0;
  vec2 packetDir=vec2(0.0);
  for(int i=0;i<${MAX_PACKETS};i++){
    vec4 a=uPacketA[i];
    vec4 b=uPacketB[i];
    vec2 d=vec2((x0-a.x)/(a.z*.95),(z0-a.y)/(a.z*2.25));
    float core=exp(-dot(d,d)*1.55);
    float shell=exp(-dot(d*vec2(1.45,.75),d*vec2(1.45,.75))*0.52);
    float burst=.18 + 1.22*pow(max(0.0,sin(t*(.56+b.z*.06)+b.w+float(i)*1.41)),3.2);
    float gust=(core*1.05 + shell*0.40) * a.w * burst;
    packetWind += gust;
    packetDir += normalize(vec2(b.x,b.y)) * gust;
  }

  float whirlWind=0.0;
  vec2 whirlDir=vec2(0.0);
  for(int i=0;i<${MAX_WHIRLS};i++){
    vec4 a=uWhirlA[i];
    vec4 b=uWhirlB[i];
    vec2 delta=vec2(x0-a.x,z0-a.y);
    float dist=max(length(delta),0.0001);
    vec2 radial=delta/dist;
    vec2 tangent=vec2(-radial.y, radial.x) * b.x;
    float core=exp(-pow(dist/max(a.z,0.001),2.0)*2.1);
    float ring=exp(-pow((dist-a.z*0.55)/max(a.z*0.38,0.001),2.0)*2.0);
    float pulse=.20 + 0.95*pow(max(0.0,sin(t*.92 + b.y + float(i)*2.1)),2.8);
    float whirlG=(core*0.70 + ring*0.90) * a.w * pulse;
    whirlWind += whirlG;
    whirlDir += (tangent + radial*0.14) * whirlG;
  }

  float micro=(fbm(vec2(x0*.18+seed*2.8+t*.05,z0*.15+t*.18))-.5);
  float wind=clamp((.56*band1+.18*band2+.08*band3)*(.9+.22*field)+.08+.10*micro+packetWind*.60+whirlWind*.36,0.0,1.9);
  vec2 baseDir=normalize(vec2(.02+.10*sin(t*.12+z0*.016),-1.0));
  vec2 crossDir=vec2(sign(cross)*0.20,-0.12);
  vec2 dirMix=baseDir + crossDir*(.12+.18*band2) + packetDir*.42 + whirlDir*.34 + vec2(micro*.06,0.0);
  vec2 windDir=dirMix / max(length(dirMix),1e-4);

  float bendAmp=h*(.045+.36*wind)*pow(prog,1.55);
  vec3 wp=vec3(x0,prog*h,z0);
  wp.xz+=windDir*bendAmp;
  wp.x+=lean*h*prog*prog;
  wp.y-=h*(.016+.095*wind)*pow(prog,2.0);

  float taper=pow(1.0-prog,.82);
  vec2 sideDir=normalize(vec2(cos(yaw)*.20+.82,sin(yaw)*.20));
  wp.xz+=sideDir*side*w*taper;

  vDepth=clamp((-z0+2.0)/96.0,0.0,1.0);
  vTip=prog;
  vWind=wind;
  vTone=tone;
  vBlur=smoothstep(0.0,.22,vDepth)*(1.0-smoothstep(.28,.72,vDepth));
  gl_Position=projectionMatrix*viewMatrix*vec4(wp,1.0);
}`;

const grassFS = `
precision highp float;
varying float vDepth;
varying float vTip;
varying float vWind;
varying float vTone;
varying float vBlur;
void main(){
  vec3 c0=vec3(.39,.56,.19);
  vec3 c1=vec3(.52,.69,.26);
  vec3 c2=vec3(.72,.81,.47);
  vec3 c=mix(c0,c1,.32+vTone*.30);
  c=mix(c,c2,smoothstep(.30,1.0,vDepth));
  c+=vec3(.055,.06,.012)*vWind;
  c+=vec3(.018,.024,.004)*vTip;
  c=mix(c,vec3(.88,.91,.84),smoothstep(.52,1.0,vDepth)*.62);
  c=mix(c,vec3(.64,.74,.44),vBlur*.22);
  float alpha=mix(.56,.16,smoothstep(.42,1.0,vDepth));
  alpha*=mix(1.0,.72,vBlur);
  gl_FragColor=vec4(c,alpha);
}`;

const grassMat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader:grassVS,
  fragmentShader:grassFS,
  transparent:true,
  depthWrite:false,
  side:THREE.DoubleSide
});
const grassMesh = new THREE.Mesh(grassGeo, grassMat);
grassMesh.frustumCulled = false;
scene.add(grassMesh);

const hazeGeo = new THREE.PlaneGeometry(120,26,1,1);
const hazeMat = new THREE.ShaderMaterial({
  transparent:true,
  depthWrite:false,
  vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`precision highp float; varying vec2 vUv; void main(){ float a=pow(sin(vUv.y*3.1415926),1.35)*.16; a*=1.0-smoothstep(.74,1.0,vUv.x); gl_FragColor=vec4(.93,.95,.90,a);}`
});
const haze = new THREE.Mesh(hazeGeo, hazeMat);
haze.position.set(0,4.7,-76);
scene.add(haze);

const foregroundGeo = new THREE.PlaneGeometry(120,24,1,1);
const foregroundMat = new THREE.ShaderMaterial({
  transparent:true,
  depthWrite:false,
  vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`precision highp float; varying vec2 vUv; void main(){ float a=pow(1.0-vUv.y,1.7)*.22; a*=smoothstep(.05,.35,vUv.x)*(1.0-smoothstep(.65,.95,vUv.x)); gl_FragColor=vec4(.75,.82,.63,a);}`
});
const foreground = new THREE.Mesh(foregroundGeo, foregroundMat);
foreground.position.set(0,0.65,-4.0);
foreground.rotation.x = -Math.PI * 0.5;
scene.add(foreground);

function resize(){
  const w = hero.clientWidth;
  const h = hero.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize, {passive:true});
resize();

const clock = new THREE.Clock();
let elapsed = 0;
renderer.setAnimationLoop(()=>{
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  uniforms.uTime.value = elapsed;
  updatePackets(dt, elapsed);
  updateWhirls(dt, elapsed);
  renderer.render(scene, camera);
});

document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden) clock.getDelta();
});
</script>
</body>
</html>
