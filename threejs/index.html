<body>
<main id="hero" aria-label="手前は非常に密な草、中景はやや低密度で半透明、遠景は個々の草が段々と消えて面になる草原">

</main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.min.js';

const ds=[{base:(Math.random()-.5)*.40,amp:.16+Math.random()*.18,f:.045+Math.random()*.025,p:Math.random()*6.283},{base:.62+Math.random()*.44,amp:.16+Math.random()*.20,f:.050+Math.random()*.030,p:Math.random()*6.283},{base:-1.06+Math.random()*.44,amp:.16+Math.random()*.20,f:.048+Math.random()*.028,p:Math.random()*6.283}];

const groundVS=`varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`;

const groundGeo=new THREE.PlaneGeometry(112,110);groundGeo.rotateX(-Math.PI/2);groundGeo.translate(0,0,-48);scene.add(new THREE.Mesh(groundGeo,new THREE.ShaderMaterial({uniforms,vertexShader:groundVS,fragmentShader:groundFS})));
const seg=6,pos=[],idx=[];for(let s=0;s<=seg;s++){const y=s/seg;pos.push(-.5,y,0,.5,y,0)}for(let s=0;s<seg;s++){const a=s*2,b=a+1,c=a+2,d=a+3;idx.push(a,b,c,b,d,c)}
const grassGeo=new THREE.InstancedBufferGeometry();grassGeo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));grassGeo.setIndex(idx);
const bladeCount=mobile?30000:62000,instA=new Float32Array(bladeCount*4),instB=new Float32Array(bladeCount*4);
function sm(a,b,x){const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)}
for(let i=0;i<bladeCount;i++){const r=Math.random();let d;if(r<.74)d=Math.pow(Math.random(),3.6);else if(r<.95)d=.16+Math.pow(Math.random(),1.7)*.46;else d=.58+Math.random()*.42;const z=5-d*96,depth=Math.min(1,Math.max(0,(-z+2)/96)),spread=10.5+depth*37.5,x=(Math.random()-.5)*spread*2,mid=sm(.20,.66,depth),far=sm(.56,.98,depth),front=1-depth;const h=Math.max(.08,.16+front*front*.27+(1-mid)*.07+Math.random()*.18-mid*.05-far*.05),w=Math.max(.0038,.0063+front*.010+Math.random()*.006-mid*.001-far*.001);const o=i*4;instA[o]=x;instA[o+1]=z;instA[o+2]=h;instA[o+3]=w;instB[o]=Math.random();instB[o+1]=Math.random();instB[o+2]=Math.random();instB[o+3]=Math.random()}

const grassVS=`precision highp float;attribute vec4 iXZHW;attribute vec4 iSeed;uniform float uTime;uniform float uMotion;uniform vec4 uPacketA[${MAX_PACKETS}];uniform vec4 uPacketB[${MAX_PACKETS}];uniform vec4 uWhirlA[${MAX_WHIRLS}];uniform vec4 uWhirlB[${MAX_WHIRLS}];uniform vec2 uDirA;uniform vec2 uDirB;uniform vec2 uDirC;uniform float uInterference;varying float vDepth;varying float vTip;varying float vWind;varying float vTone;varying float vFade;${glsl}void main(){float prog=position.y,side=position.x*2.,x0=iXZHW.x,z0=iXZHW.y,h=iXZHW.z,w=iXZHW.w,seed=iSeed.x,yaw=iSeed.y*6.2831853,lean=(iSeed.z-.5)*.12,tone=iSeed.w,t=uTime*uMotion;vec2 p=vec2(x0,z0),nA=vec2(-uDirA.y,uDirA.x),nB=vec2(-uDirB.y,uDirB.x),nC=vec2(-uDirC.y,uDirC.x);float b1=ridge(sin(dot(p,uDirA)*.086-t*.58+sin(dot(p,nA)*.032+t*.08)*1.45+seed*.30)-.12,4.2),b2=ridge(sin(dot(p,uDirB)*.150-t*.82+sin(dot(p,nB)*.028-t*.10)*.72+seed*.52)+.18,7.),b3=ridge(sin(dot(p,uDirC)*.214-t*1.06+sin(dot(p,nC)*.030+t*.12)*.62+seed*.94)-.30,8.4),overlap=b1*b2+.62*b2*b3+.36*b1*b3,front=ridge(sin(dot(p,vec2(0.,-1.))*.145-t*.96)-.26,3.1)+.55*ridge(sin(dot(p,normalize(vec2(.42,-1.)))*.156-t*1.08)-.18,3.9)+.55*ridge(sin(dot(p,normalize(vec2(-.42,-1.)))*.156-t*1.04)-.18,3.9);float packetWind=0.;vec2 packetDir=vec2(0.);for(int i=0;i<${MAX_PACKETS};i++){vec4 a=uPacketA[i],b=uPacketB[i];vec2 d=vec2((x0-a.x)/(a.z*.95),(z0-a.y)/(a.z*2.25));float core=exp(-dot(d,d)*1.55),shell=exp(-dot(d*vec2(1.45,.75),d*vec2(1.45,.75))*.52),burst=.10+1.55*pow(max(0.,sin(t*(.98+b.z*.075)+b.w+float(i)*1.41)),4.),gust=(core*1.05+shell*.40)*a.w*burst;packetWind+=gust;packetDir+=normalize(vec2(b.x,b.y))*gust;}float whirlWind=0.;vec2 whirlDir=vec2(0.);for(int i=0;i<${MAX_WHIRLS};i++){vec4 a=uWhirlA[i],b=uWhirlB[i];vec2 delta=vec2(x0-a.x,z0-a.y);float dist=max(length(delta),.0001);vec2 radial=delta/dist,tangent=vec2(-radial.y,radial.x)*b.x;float core=exp(-pow(dist/max(a.z,.001),2.)*2.1),ring=exp(-pow((dist-a.z*.55)/max(a.z*.38,.001),2.)*2.),g=(core*.70+ring*.90)*a.w*(.12+1.08*pow(max(0.,sin(t*1.82+b.y+float(i)*2.1)),3.4));whirlWind+=g;whirlDir+=(tangent+radial*.14)*g;}float depth=clamp((-z0+2.)/96.,0.,1.),midVis=1.-smoothstep(.22,.62,depth),farVis=1.-smoothstep(.55,.97,depth);vFade=clamp(midVis*.76+farVis*.24,0.,1.);float micro=fbm(vec2(x0*.18+seed*2.8+t*.05,z0*.15-t*.18))-.5,wind=clamp(((.50*b1+.25*b2+.18*b3+.24*overlap+.35*uInterference+.42*front)*(.9+.22*fbm(vec2(x0*.065+t*.018,z0*.058-t*.09))))*vFade+.08+.10*micro+packetWind*.64+whirlWind*.40,0.,2.2);vec2 dir=uDirA*(.30+.52*b1)+uDirB*(.44*b2)+uDirC*(.38*b3)+normalize(uDirA+uDirB+uDirC+vec2(.001))*(.30*overlap)+packetDir*.48+whirlDir*.42+vec2(micro*.08,0.);dir/=max(length(dir),1e-4);float bend=h*(.05+.38*wind)*pow(prog,1.55);vec3 wp=vec3(x0,prog*h,z0);wp.xz+=dir*bend;wp.x+=lean*h*prog*prog;wp.y-=h*(.018+.10*wind)*pow(prog,2.);float taper=pow(1.-prog,.82);vec2 sideDir=normalize(vec2(cos(yaw)*.20+.82,sin(yaw)*.20));wp.xz+=sideDir*side*w*taper;vDepth=depth;vTip=prog;vWind=wind;vTone=tone;gl_Position=projectionMatrix*viewMatrix*vec4(wp,1.);}`;
const grassFS=`precision highp float;varying float vDepth;varying float vTip;varying float vWind;varying float vTone;varying float vFade;void main(){vec3 c0=vec3(.39,.56,.19),c1=vec3(.52,.69,.26),c2=vec3(.72,.81,.47);vec3 c=mix(c0,c1,.30+vTone*.28);c=mix(c,c2,smoothstep(.28,1.,vDepth));c+=vec3(.055,.06,.012)*vWind;c+=vec3(.018,.024,.004)*vTip;c=mix(c,vec3(.88,.91,.84),smoothstep(.48,1.,vDepth)*.64);c=mix(c,vec3(.86,.89,.80),1.-vFade);float alpha=mix(.94,.43,smoothstep(.16,.58,vDepth));alpha=mix(alpha,.035,smoothstep(.50,.96,vDepth));alpha*=vFade;if(alpha<.01)discard;gl_FragColor=vec4(c,alpha);}`;
