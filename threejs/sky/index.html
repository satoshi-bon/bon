<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living Field — version router</title>
<script>
(()=>{
  const raw=new URLSearchParams(location.search).get('v')||'05';
  const v=raw.replace(/^v/i,'').padStart(2,'0');
  const target=v==='03'?'v03/':'v05/';
  location.replace(new URL(target,location.href).href);
})();
</script>
</head>
<body>
<p><a href="v05/">Living Field v05</a> / <a href="v03/">Living Field v03</a></p>
</body>
</html>
